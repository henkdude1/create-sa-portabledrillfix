name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Game test server
        # The gradle task can exit 0 even when the server fails to launch, so
        # explicitly require the gametest success marker in the log.
        run: |
          set -o pipefail
          ./gradlew runGameTestServer --stacktrace 2>&1 | tee gametest.log
          grep -q "required tests passed" gametest.log
        timeout-minutes: 15

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
