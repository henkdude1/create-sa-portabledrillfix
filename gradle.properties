# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment mappings (https://parchmentmc.org/docs/getting-started)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.233
neo_version_range=[21.1.0,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

## Mod Properties
mod_id=create_sa_drillfix
mod_name=Create S&A Portable Drill Fix
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.henkdude1.createsadrillfix
mod_authors=henkdude1
mod_description=Makes the Digging and Chunk Eater enchantments from Create: Stuff 'N Additions apply the tool's other enchantments (Silk Touch, Fortune, ...) and proper XP drops to every block broken in their area of effect.
